<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/galaxyhire-logo.png" />
    <link rel="apple-touch-icon" href="/galaxyhire-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GalaxyHire — a private workspace to find jobs, tailor documents, and track applications." />
    <title>GalaxyHire</title>
    <!-- Neo-brutalist type: Archivo Black (display), Space Grotesk (body), JetBrains Mono (code).
         Fallbacks in --font-* keep the UI correct when offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Apply the saved theme before first paint to avoid a flash of the wrong
         theme. Mirrors src/shared/lib/theme.ts (kept tiny + dependency-free). */
      (function () {
        try {
          var pref = localStorage.getItem("jhm-theme") || "system";
          var dark = pref === "dark" || (pref === "system"
            && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var theme = dark ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) { /* no-op: defaults to light via CSS */ }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
