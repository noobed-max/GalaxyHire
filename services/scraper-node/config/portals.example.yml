# ============================================================================
# GalaxyHire portal configuration — career-ops connectors only
# ============================================================================
# SHIPPED SEED. The scraper loads `config/portals.yml` first (gitignored — your
# local customizations live there) and falls back to THIS file, so a fresh
# checkout scrapes the measured set below with no setup. To customize, copy
# this file to `portals.yml` in the same directory and edit the copy.
#
# Format: career-ops `portals.yml` (its providers were written against these
# field names — see services/scraper-node/src/config.ts). GalaxyHire adds one
# namespaced block per entry that no provider reads:
#
#   gh:
#     recency:  strict      — source proves postings are ≤24h (date_posted inside
#                             the window; undated rows are DROPPED). The deliberate
#                             inversion of career-ops' "undated always passes".
#               first_seen  — source publishes no usable date, or refreshes slower
#                             than a day (the ATS reality: measured 2026-08-27,
#                             GitLab/Greenhouse 0/220 ≤24h). Novelty = "new to the
#                             corpus", enforced retrieval-side on first_seen_at.
#               off         — never scrape (retired feed, bot-walled endpoint).
#     toggle:   default state of this portal in the UI's per-portal selector.
#     region:   display grouping only.
#     timeout_ms: per-portal wall clock (default 45s; pagination hogs raise it).
#
# Every recency/toggle value below is MEASURED (MAJOR-CHANGE/04, run 2026-08-27
# against career-ops 1c866a9), with the ≤24h count as the comment. Endpoints rot:
# re-run the probe before changing one from memory.
#
# Keyword/query injection: vdab, jobbankca, mycareersfuture, arbeitsagentur,
# wttj, a16z-speedrun-talent, alibaba, meituan, tencent, careerviet, itviec have
# no keywords in this file ON PURPOSE — src/query-injection.ts fills each
# provider's own key from the searched role at run time.

job_boards:

  # ── Aggregators proven fresh ≤24h (strict) ──────────────────────────────
  - name: Arbeitnow
    provider: arbeitnow
    gh: { recency: strict, toggle: true, region: eu }        # 205/300 ≤24h
  - name: Jobicy
    provider: jobicy
    gh: { recency: strict, toggle: true, region: remote }    # 50/50 ≤24h
  - name: Himalayas
    provider: himalayas
    gh: { recency: strict, toggle: true, region: remote }    # 20/20 ≤24h
  - name: JustJoin.it
    provider: justjoin
    careers_url: https://justjoin.it/job-offers/all-locations
    gh: { recency: strict, toggle: true, region: eu }        # 2136/5000 ≤24h — the volume engine
  - name: Careerviet
    provider: careerviet
    gh: { recency: strict, toggle: true, region: sea }       # 100/100 ≤24h (Vietnam)
  - name: ITviec
    provider: itviec
    gh: { recency: strict, toggle: true, region: sea }       # 38/40 ≤24h (Vietnam)
  - name: Welcome to the Jungle
    provider: wttj
    gh: { recency: strict, toggle: true, region: eu }        # 84/100 ≤24h; role injected as wttj.queries
  - name: 4 Day Week
    provider: 4dayweek
    gh: { recency: strict, toggle: true, region: remote }    # 4/75 ≤24h
  - name: We Work Remotely
    provider: weworkremotely
    gh: { recency: strict, toggle: true, region: remote }    # 5/90 ≤24h
  - name: a16z speedrun talent
    provider: a16z-speedrun-talent
    gh: { recency: strict, toggle: true, region: us }        # 8/300 ≤24h; role injected as q
  - name: Meituan Careers
    provider: meituan
    gh: { recency: strict, toggle: true, region: cn }        # 200/200 ≤24h, ships full JD text
  - name: Alibaba Careers
    provider: alibaba
    gh: { recency: strict, toggle: true, region: cn }        # 7/200 ≤24h, ships full JD text
  - name: MyCareersFuture
    provider: mycareersfuture
    gh: { recency: strict, toggle: true, region: sea }       # 4/200 ≤24h; role injected as keywords
  - name: VDAB
    provider: vdab
    gh: { recency: strict, toggle: false, region: eu }       # 6/200 ≤24h; role injected as keywords
  - name: Tencent Careers
    provider: tencent
    gh: { recency: strict, toggle: false, region: cn }       # 1/200 ≤24h; ships full JD text
  - name: Get on Board
    provider: getonbrd
    gh: { recency: strict, toggle: false, region: latam }    # 2/300 ≤24h
  - name: Joinup
    provider: joinup
    gh: { recency: strict, toggle: false, region: eu }       # 2/10 ≤24h

  # ── Dated-but-slow or undated boards, kept honestly as first_seen ───────
  - name: Hacker News — Who is hiring?
    provider: hackernews
    gh: { recency: first_seen, toggle: true, region: us }    # monthly thread: 0/240 ≤24h by design
  - name: SolidJobs IT
    provider: solidjobs
    careers_url: https://solid.jobs/public-api/offers/it?campaign=galaxyhire
    gh: { recency: first_seen, toggle: true, region: eu }    # no dates; enricher adds JD text + level
  - name: NoFluffJobs
    provider: nofluffjobs
    careers_url: https://nofluffjobs.com/pl
    gh: { recency: first_seen, toggle: true, region: eu }    # 0/657 ≤24h, 80 ≤72h
  - name: RemoteOK
    provider: remoteok
    gh: { recency: first_seen, toggle: true, region: remote }   # publishes no dates
  - name: Remotive
    provider: remotive
    gh: { recency: first_seen, toggle: true, region: remote }   # no dates, 19 jobs
  - name: Remotli
    provider: remotli
    gh: { recency: first_seen, toggle: true, region: remote }   # 0/100 ≤24h, ships full JD text
  - name: Cryptocurrency Jobs
    provider: cryptocurrencyjobs
    gh: { recency: first_seen, toggle: true, region: web3 }      # 0/75 ≤24h, ships JD text
  - name: Working Nomads
    provider: workingnomads
    gh: { recency: first_seen, toggle: true, region: remote }    # no dates
  - name: IBM Careers
    provider: ibm
    gh: { recency: first_seen, toggle: true, region: global }    # no dates, company single-tenant
  - name: Landing.jobs
    provider: landingjobs
    gh: { recency: first_seen, toggle: true, region: eu }
  - name: Jobspresso
    provider: jobspresso
    gh: { recency: first_seen, toggle: false, region: remote }
  - name: LaraJobs
    provider: larajobs
    gh: { recency: first_seen, toggle: false, region: php }
  - name: The Muse
    provider: themuse
    gh: { recency: first_seen, toggle: false, region: us, timeout_ms: 150000 }  # 119s full crawl, no dates
  - name: Agentic Engineering Jobs
    provider: agentic-jobs
    gh: { recency: first_seen, toggle: false, region: global, timeout_ms: 150000 }  # ~100s crawl, ships JD text
  - name: Jobstreet / SEEK
    provider: jobstreet
    gh: { recency: first_seen, toggle: false, region: sea }       # 0/90 ≤24h in the 2-page window
  - name: Tower
    provider: torre
    gh: { recency: first_seen, toggle: false, region: global }
  - name: Senjob
    provider: senjob
    gh: { recency: first_seen, toggle: false, region: latam }     # company field empty on rows
  - name: Flowxtra
    provider: flowxtra
    gh: { recency: first_seen, toggle: false, region: eu }
  - name: NoDesk
    provider: nodesk
    gh: { recency: first_seen, toggle: false, region: remote }    # location field empty
  - name: HigherEdJobs
    provider: higheredjobs
    gh: { recency: first_seen, toggle: false, region: us }
  - name: The Hub
    provider: thehub
    gh: { recency: first_seen, toggle: false, region: nordics }   # no dates
  - name: Yourator
    provider: yourator
    gh: { recency: first_seen, toggle: false, region: br }        # no dates
  - name: getManfred
    provider: manfred
    gh: { recency: first_seen, toggle: false, region: eu }        # no dates
  - name: Arbeitsagentur
    provider: arbeitsagentur
    gh: { recency: first_seen, toggle: false, region: de }        # no dates; role injected as keywords
  - name: Job Bank Canada
    provider: jobbankca
    gh: { recency: first_seen, toggle: false, region: ca, timeout_ms: 120000 }  # honors Crawl-delay 5s

  # ── Known broken, kept visible so nobody re-enables them by accident ────
  - name: EchoJobs
    provider: echojobs
    gh: { recency: "off", toggle: false, note: "retired upstream #2976 — feed behind bot protection" }
  - name: Glints
    provider: glints
    gh: { recency: "off", toggle: false, note: "HTTP 403 bot wall measured 2026-08-27" }

